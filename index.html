<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Grand Bajío</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- jQuery y Slick Slider (Plugin) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
</head>
<body>
    <!-- Barra de navegación hacia los otros sitios -->
    <nav>
        <div style="font-size: 1.5em; font-weight: bold; color: var(--accent);">Hotel Grand</div>
        <div>
            <a href="index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="habitaciones.html">Habitaciones</a>
            <a href="contacto.html">Contacto</a>
            <button id="btn-tema" class="btn">Tema</button>
        </div>
    </nav>

    <main class="container">
        <div class="reloj-container" id="fecha-hora"></div>
        <h1>Bienvenidos al Descanso Absoluto</h1>
        
        <!-- Contenedor del Slick Slider -->
        <div class="slider-habitaciones" style="margin: 30px 0;">
            
            <!-- Imagen 1: Suite -->
            <div style="position: relative;">
                <img src="imagenes/suite.jpg" alt="Suite Presidencial" style="width:100%; height:400px; object-fit:cover; border-radius:8px;">
                <!-- Letrero -->
                <div style="position: absolute; bottom: 30px; left: 30px; background-color: rgba(26, 37, 47, 0.85); color: #d4af37; padding: 15px 25px; border-radius: 5px; font-size: 1.5em; font-weight: bold; border-left: 4px solid #d4af37;">
                    Suite Presidencial
                </div>
            </div>
            
            <!-- Imagen 2: Spa -->
            <div style="position: relative;">
                <img src="imagenes/spa.jpg" alt="Alberca y Spa" style="width:100%; height:400px; object-fit:cover; border-radius:8px;">
                <!-- Letrero -->
                <div style="position: absolute; bottom: 30px; left: 30px; background-color: rgba(26, 37, 47, 0.85); color: #d4af37; padding: 15px 25px; border-radius: 5px; font-size: 1.5em; font-weight: bold; border-left: 4px solid #d4af37;">
                    Alberca y Spa
                </div>
            </div>
            
            <!-- Imagen 3: Restaurante -->
            <div style="position: relative;">
                <img src="imagenes/restaurante.jpg" alt="Restaurante Gourmet" style="width:100%; height:400px; object-fit:cover; border-radius:8px;">
                <!-- Letrero -->
                <div style="position: absolute; bottom: 30px; left: 30px; background-color: rgba(26, 37, 47, 0.85); color: #d4af37; padding: 15px 25px; border-radius: 5px; font-size: 1.5em; font-weight: bold; border-left: 4px solid #d4af37;">
                    Restaurante Gourmet
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p>© 2026 Hotel Grand. Todos los derechos reservados.</p>
    </footer>

    <!-- Botón Ir Arriba -->
    <button id="btn-arriba">▲</button>
    <script src="js/app.js"></script>
</body>
</html>
